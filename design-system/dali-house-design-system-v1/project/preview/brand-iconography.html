<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); background: var(--bg); }
  body { padding: 26px 28px; color: var(--fg); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; align-items: end; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .glyph {
    width: 48px; height: 48px; border-radius: 999px;
    border: 1px solid rgba(201,169,110,0.20);
    background: rgba(201,169,110,0.12);
    color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .label { font-size: 11px; font-weight: 500; color: var(--fg); }
  .meta { font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--fg-soft); text-align: center; line-height: 1.5; }
  .group-title { font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  .section + .section { margin-top: 22px; }
  .caption { font-family: var(--font-serif); font-style: italic; font-size: 12.5px; color: var(--fg-muted); margin-top: 16px; line-height: 1.55; }
</style></head><body>
  <p class="group-title">Hand-rolled inline SVG · stroke 1.5–1.8 · rounded caps</p>
  <div class="row">
    <div class="ic">
      <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h18v4H3z"/><path d="M5 14v-3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M8 11h8"/><path d="M5 18v2 M19 18v2"/></svg></span>
      <div class="label">Sofa</div>
      <div class="meta">Furnished</div>
    </div>
    <div class="ic">
      <span class="glyph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4 M16 3v4"/></svg></span>
      <div class="label">Calendar</div>
      <div class="meta">Flexible</div>
    </div>
    <div class="ic">
      <span class="glyph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <div class="label">Users</div>
      <div class="meta">Community</div>
    </div>
    <div class="ic">
      <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
      <div class="label">Chat</div>
      <div class="meta">Step 1</div>
    </div>
    <div class="ic">
      <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <div class="label">House</div>
      <div class="meta">Step 2</div>
    </div>
    <div class="ic">
      <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></span>
      <div class="label">Key</div>
      <div class="meta">Step 3</div>
    </div>
    <div class="ic">
      <span class="glyph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg></span>
      <div class="label">Email</div>
      <div class="meta">Footer</div>
    </div>
  </div>
  <p class="caption">All icons live as inline SVG, stroke ≈ 1.6, in a tan tinted circle. No icon font; no emoji in UI.</p>
</body></html>
