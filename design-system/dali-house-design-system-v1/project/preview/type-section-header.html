<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg-warm); font-family: var(--font-sans); }
  body { padding: 38px 32px; text-align: center; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  h2 { font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1.18; color: var(--fg); letter-spacing: -0.01em; margin: 0 0 8px; }
  .lede { font-size: 14px; line-height: 1.7; color: var(--fg-muted); font-weight: 300; max-width: 520px; margin: 14px auto 0; }
</style></head><body>
  <p class="eyebrow">About Dali House</p>
  <h2>Your <em style="color: var(--accent); font-style: italic;">relocation oasis</em><br>in Dallas.</h2>
  <p class="lede">The canonical section header: eyebrow tracked 0.22em in tan, two-line serif title with a single italic word for emphasis.</p>
</body></html>
