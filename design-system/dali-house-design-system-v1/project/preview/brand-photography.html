<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); background: var(--bg); }
  body { padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { aspect-ratio: 4/3; border-radius: 12px; background-size: cover; background-position: center; box-shadow: 0 2px 12px rgba(61,35,20,0.07); }
  .caption { grid-column: 1 / -1; font-size: 12px; color: var(--fg-muted); margin-top: 4px; font-family: var(--font-serif); font-style: italic; line-height: 1.5; }
</style></head><body>
  <div class="grid">
    <div class="tile" style="background-image: url(../assets/dali-house-hero.jpg);"></div>
    <div class="tile" style="background-image: url(../assets/room-living.jpg);"></div>
    <div class="tile" style="background-image: url(../assets/room-bedroom1.jpg);"></div>
    <div class="tile" style="background-image: url(../assets/room-bedroom2.jpg);"></div>
    <div class="tile" style="background-image: url(../assets/room-kitchen.jpg);"></div>
    <div class="tile" style="background-image: url(../assets/room-bathroom.jpg);"></div>
    <div class="tile" style="background-image: url(../assets/room-laundry.jpg);"></div>
    <div class="tile" style="background-image: url(../assets/dali-house-host.jpg); background-position: center 20%;"></div>
    <div class="caption">Warm natural light. Real interiors. Vintage pieces, original artwork, modern living.</div>
  </div>
</body></html>
