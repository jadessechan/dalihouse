<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); background: var(--bg); }
  body { padding: 36px 32px; }
  .quote {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 21px;
    line-height: 1.6;
    color: var(--fg);
    border-left: 2px solid var(--accent);
    padding: 4px 0 4px 22px;
    margin: 0 0 28px;
    font-weight: 400;
  }
  .quote.big {
    font-size: 24px;
  }
  .cite { font-family: var(--font-sans); font-style: normal; font-size: 11.5px; color: var(--fg-soft); letter-spacing: 0.04em; display: block; margin-top: 10px; }
</style></head><body>
  <blockquote class="quote big">
    &ldquo;Home isn&rsquo;t just about where you live &mdash; it&rsquo;s about the people and the life you build.&rdquo;
  </blockquote>
  <blockquote class="quote">
    &ldquo;Not just a place to live &mdash; but a space to land, connect, and grow.&rdquo;
  </blockquote>
</body></html>
