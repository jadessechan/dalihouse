<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); }
  body { background: var(--bg-dark-2); padding: 26px; color: var(--fg-on-dark); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
  }
  .chip.outline {
    border: 1px solid rgba(250,244,232,0.15);
    color: rgba(250,244,232,0.75);
  }
  .chip.filled {
    border: 1px solid rgba(250,244,232,0.20);
    background: rgba(255,255,255,0.08);
    color: rgba(250,244,232,0.80);
  }
  .chip svg { color: #6bcb77; }
  .row + .row { margin-top: 16px; }
  .eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
</style></head><body>
  <div class="row">
    <p class="eyebrow">Highlights · outline</p>
    <div class="chips">
      <span class="chip outline"><svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Utilities included</span>
      <span class="chip outline"><svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Monthly cleaning</span>
      <span class="chip outline"><svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Curated interiors</span>
      <span class="chip outline"><svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Safe &amp; central location</span>
    </div>
  </div>
  <div class="row">
    <p class="eyebrow">Amenities · filled</p>
    <div class="chips">
      <span class="chip filled" style="color: rgba(250,244,232,0.80);"><svg width="13" height="13" viewBox="0 0 20 20" fill="rgba(250,244,232,0.70)"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Full size bed</span>
      <span class="chip filled" style="color: rgba(250,244,232,0.80);"><svg width="13" height="13" viewBox="0 0 20 20" fill="rgba(250,244,232,0.70)"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Work station</span>
      <span class="chip filled" style="color: rgba(250,244,232,0.80);"><svg width="13" height="13" viewBox="0 0 20 20" fill="rgba(250,244,232,0.70)"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Full-length mirror</span>
      <span class="chip filled" style="color: rgba(250,244,232,0.80);"><svg width="13" height="13" viewBox="0 0 20 20" fill="rgba(250,244,232,0.70)"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>Original artwork</span>
    </div>
  </div>
</body></html>
