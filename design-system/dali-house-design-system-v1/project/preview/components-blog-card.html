<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); background: var(--bg); }
  body { padding: 22px; }
  .card {
    display: grid; grid-template-columns: 1fr 1.2fr;
    background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 2px 20px rgba(61, 35, 20, 0.055);
    min-height: 220px;
  }
  .thumb { position: relative; background: var(--bg-warm); display:flex; align-items:center; justify-content:center; color: rgba(124,92,62,0.4); font-family: ui-monospace, monospace; font-size: 11px; }
  .thumb::before { content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(124,92,62,0.04) 8px, rgba(124,92,62,0.04) 16px); }
  .pill {
    position: absolute; top: 14px; left: 14px;
    background: var(--accent); color: var(--fg);
    padding: 5px 12px; border-radius: 999px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    z-index: 1;
  }
  .body { padding: 28px 32px; display: flex; flex-direction: column; justify-content: center; }
  .meta { font-size: 11.5px; color: var(--fg-soft); letter-spacing: 0.04em; margin: 0 0 12px; }
  .title { font-family: var(--font-serif); font-size: 22px; font-weight: 500; line-height: 1.35; color: var(--fg); margin: 0 0 12px; }
  .desc { font-size: 13px; line-height: 1.72; font-weight: 300; color: var(--fg-muted); margin: 0; }
  .more { display:inline-flex; align-items:center; gap: 6px; margin-top: 16px; color: var(--accent); font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
</style></head><body>
  <div class="card">
    <div class="thumb">
      <span class="pill">Featured</span>
      <span style="position:relative; z-index:1;">interior / lifestyle photo</span>
    </div>
    <div class="body">
      <div class="meta">April 5, 2026 · 6 min read</div>
      <div class="title">Why community matters when you're starting over in a new city</div>
      <div class="desc">Relocating is exciting — but loneliness is real. Here's why having a built-in community makes all the difference.</div>
      <a href="#" class="more">Read article →</a>
    </div>
  </div>
</body></html>
