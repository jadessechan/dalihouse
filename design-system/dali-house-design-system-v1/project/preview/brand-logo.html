<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); }
  body { display: grid; grid-template-columns: 1fr 1fr; min-height: 220px; }
  .pane { padding: 28px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  .light { background: var(--bg); }
  .dark  { background: var(--bg-dark); }
  .lockup img { width: 260px; height: auto; display: block; }
  .lockup.invert img { filter: brightness(0) invert(1); opacity: 0.9; }
  .label { font-family: ui-monospace, monospace; font-size: 10px; color: var(--fg-soft); letter-spacing: 0.05em; }
  .dark .label { color: var(--fg-on-dark-soft); }
</style></head><body>
  <div class="pane light">
    <div class="lockup"><img src="../assets/logo-wordmark.png" alt="Dali House"></div>
    <div class="label">Primary lockup · on cream</div>
  </div>
  <div class="pane dark">
    <div class="lockup invert"><img src="../assets/logo-wordmark.png" alt="Dali House"></div>
    <div class="label">Knocked out · on charcoal</div>
  </div>
</body></html>
