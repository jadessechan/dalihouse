<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg); font-family: var(--font-sans); }
  body { padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-on-light); background: #fff; }
  .row.dark { background: var(--bg-dark); border-color: var(--border-on-dark); }
  .dot { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .label { font-size: 12px; font-weight: 500; }
  .meta  { font-size: 10.5px; font-family: ui-monospace, monospace; color: var(--fg-soft); margin-left: auto; }
  .row.dark .label { color: var(--fg-on-dark); }
  .row.dark .meta  { color: var(--fg-on-dark-soft); }
  h4 { font-family: var(--font-sans); font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px 4px; }
</style></head><body>
<div class="grid">
  <div>
    <h4>On Light Surfaces</h4>
    <div style="display:flex; flex-direction: column; gap: 8px;">
      <div class="row"><div class="dot" style="background:#3d2314"></div><span class="label" style="color:#3d2314">Heading / Primary</span><span class="meta">--fg</span></div>
      <div class="row"><div class="dot" style="background:#7c5c3e"></div><span class="label" style="color:#7c5c3e">Body</span><span class="meta">--fg-muted</span></div>
      <div class="row"><div class="dot" style="background:rgba(124,92,62,0.55)"></div><span class="label" style="color:rgba(124,92,62,0.7)">Meta · 55%</span><span class="meta">--fg-soft</span></div>
      <div class="row"><div class="dot" style="background:#c9a96e"></div><span class="label" style="color:#c9a96e">Accent</span><span class="meta">--accent</span></div>
    </div>
  </div>
  <div>
    <h4>On Dark Surfaces</h4>
    <div style="display:flex; flex-direction: column; gap: 8px;">
      <div class="row dark"><div class="dot" style="background:#faf4e8"></div><span class="label">Cream · primary</span><span class="meta">--fg-on-dark</span></div>
      <div class="row dark"><div class="dot" style="background:rgba(250,244,232,0.55)"></div><span class="label" style="color:rgba(250,244,232,0.75)">Body · 55%</span><span class="meta">--fg-on-dark-muted</span></div>
      <div class="row dark"><div class="dot" style="background:rgba(250,244,232,0.35)"></div><span class="label" style="color:rgba(250,244,232,0.55)">Eyebrow · 35%</span><span class="meta">--fg-on-dark-soft</span></div>
      <div class="row dark"><div class="dot" style="background:#c9a96e"></div><span class="label" style="color:#c9a96e">Accent</span><span class="meta">--accent</span></div>
    </div>
  </div>
</div>
</body></html>
