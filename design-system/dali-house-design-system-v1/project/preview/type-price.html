<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg-dark-2); font-family: var(--font-sans); }
  body { padding: 30px 32px; text-align: center; color: var(--fg-on-dark); }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .price { font-family: var(--font-serif); font-size: 86px; line-height: 1; font-weight: 700; color: var(--accent); display: inline-block; margin-top: 16px; letter-spacing: -0.02em; }
  .per { font-size: 16px; color: rgba(250,244,232,0.45); margin-left: 6px; }
  .meta { font-family: ui-monospace, monospace; font-size: 10px; color: rgba(250,244,232,0.45); margin-top: 14px; letter-spacing: 0.04em; }
</style></head><body>
  <p class="eyebrow">Pricing &amp; amenities</p>
  <div>
    <span class="price">$900</span><span class="per">/month</span>
  </div>
  <p class="meta">Playfair Display · 700 · clamp(52px, 8vw, 72px) · color: --accent</p>
</body></html>
