<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg); font-family: var(--font-sans); }
  body { padding: 28px 32px; }
  .row { display: grid; grid-template-columns: 110px 1fr; align-items: baseline; gap: 18px; padding: 10px 0; border-bottom: 1px solid var(--border-on-light); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 10.5px; color: var(--fg-soft); }
  h1, h2, h3, h4, p, span { margin: 0; color: var(--fg); }
</style></head><body>
  <div class="row">
    <div class="meta">Display · 56px</div>
    <h1 style="font-family: var(--font-serif); font-size: 56px; font-weight: 500; line-height: 1.1; letter-spacing: -0.01em;">Your <em style="color: var(--accent); font-style: italic;">soft landing</em></h1>
  </div>
  <div class="row">
    <div class="meta">Section · 44px</div>
    <h2 style="font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1.2; letter-spacing: -0.01em;">How It Works</h2>
  </div>
  <div class="row">
    <div class="meta">H3 · 28px</div>
    <h3 style="font-family: var(--font-serif); font-size: 28px; font-weight: 500; line-height: 1.3;">Why community matters</h3>
  </div>
  <div class="row">
    <div class="meta">H4 · 22px</div>
    <h4 style="font-family: var(--font-serif); font-size: 22px; font-weight: 500; line-height: 1.35;">Tour the space</h4>
  </div>
  <div class="row">
    <div class="meta">Quote · 21px</div>
    <p style="font-family: var(--font-serif); font-style: italic; font-size: 21px; line-height: 1.5; color: var(--fg);">"Home isn't just about where you live — it's about the people and the life you build."</p>
  </div>
</body></html>
