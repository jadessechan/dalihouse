<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg); font-family: var(--font-sans); }
  body { padding: 26px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display:flex; flex-direction:column; align-items:flex-start; gap: 8px; }
  .box {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 4px;
  }
  .label { font-size: 11px; color: var(--fg); font-weight: 500; }
  .val { font-family: ui-monospace, monospace; font-size: 10px; color: var(--fg-soft); }
</style></head><body>
  <div class="grid">
    <div class="item"><div class="box" style="width: 4px; height: 4px;"></div><div class="label">1</div><div class="val">4px</div></div>
    <div class="item"><div class="box" style="width: 8px; height: 8px;"></div><div class="label">2</div><div class="val">8px</div></div>
    <div class="item"><div class="box" style="width: 12px; height: 12px;"></div><div class="label">3</div><div class="val">12px</div></div>
    <div class="item"><div class="box" style="width: 16px; height: 16px;"></div><div class="label">4</div><div class="val">16px</div></div>
    <div class="item"><div class="box" style="width: 20px; height: 20px;"></div><div class="label">5</div><div class="val">20px</div></div>
    <div class="item"><div class="box" style="width: 24px; height: 24px;"></div><div class="label">6</div><div class="val">24px</div></div>
    <div class="item"><div class="box" style="width: 32px; height: 32px;"></div><div class="label">8</div><div class="val">32px</div></div>
    <div class="item"><div class="box" style="width: 40px; height: 40px;"></div><div class="label">10</div><div class="val">40px</div></div>
    <div class="item"><div class="box" style="width: 48px; height: 48px;"></div><div class="label">12</div><div class="val">48px</div></div>
    <div class="item"><div class="box" style="width: 56px; height: 56px;"></div><div class="label">14</div><div class="val">56px</div></div>
    <div class="item"><div class="box" style="width: 64px; height: 64px;"></div><div class="label">16</div><div class="val">64px</div></div>
    <div class="item"><div class="box" style="width: 96px; height: 64px;"></div><div class="label">section</div><div class="val">96px·y</div></div>
  </div>
</body></html>
