<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg); font-family: var(--font-sans); }
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display:flex; flex-direction:column; gap: 8px; }
  .chip { height: 86px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); position: relative; }
  .chip.primary::after, .chip.primary2::after {
    content: ""; position: absolute; top: 8px; right: 8px;
    width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.85);
    box-shadow: 0 0 0 1.5px rgba(0,0,0,0.12);
  }
  .label { font-size: 11px; color: var(--fg); font-weight: 500; }
  .hex { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 10.5px; color: var(--fg-soft); }
  .tag { font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#faf4e8"></div><div class="label">Cream</div><div class="hex">#FAF4E8</div></div>
  <div class="sw"><div class="chip" style="background:#f3ead6"></div><div class="label">Cream Light</div><div class="hex">#F3EAD6</div></div>
  <div class="sw"><div class="chip" style="background:#e8d5b0"></div><div class="label">Tan Light</div><div class="hex">#E8D5B0</div></div>
  <div class="sw"><div class="chip primary" style="background:#c9a96e"></div><div class="label">Tan</div><div class="tag">Accent · primary</div><div class="hex">#C9A96E</div></div>
  <div class="sw"><div class="chip" style="background:#7c5c3e"></div><div class="label">Brown</div><div class="hex">#7C5C3E</div></div>
  <div class="sw"><div class="chip primary2" style="background:#7a1c1c"></div><div class="label">Crimson</div><div class="tag">Editorial · primary #2</div><div class="hex">#7A1C1C</div></div>
  <div class="sw"><div class="chip" style="background:#9a2828"></div><div class="label">Crimson Warm</div><div class="hex">#9A2828</div></div>
  <div class="sw"><div class="chip" style="background:#3d2314"></div><div class="label">Brown Deep</div><div class="hex">#3D2314</div></div>
  <div class="sw"><div class="chip" style="background:#241d16"></div><div class="label">Charcoal Mid</div><div class="hex">#241D16</div></div>
  <div class="sw"><div class="chip" style="background:#1a1612"></div><div class="label">Charcoal</div><div class="hex">#1A1612</div></div>
</div>
</body></html>
