<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); }
  body { background: var(--bg-dark); position: relative; padding: 0; min-height: 320px; overflow: hidden; }
  .photo {
    position: absolute; inset: 0;
    background: url(../assets/dali-house-bg.jpg) center / cover no-repeat;
  }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,7,5,0.5), rgba(10,7,5,0.3) 60%, rgba(10,7,5,0.7)); }
  .label { position: absolute; top: 16px; left: 22px; z-index: 2; color: var(--fg-on-dark); font-size: 10px; font-weight: 600; letter-spacing: 0.30em; text-transform: uppercase; }
  .issue { position: absolute; top: 16px; right: 22px; z-index: 2; color: rgba(250,244,232,0.7); font-family: var(--font-serif); font-style: italic; font-size: 11px; }
  .wrap { position: relative; z-index: 2; padding: 60px 36px 28px; color: var(--fg-on-dark); }
  h1 {
    font-family: var(--font-serif); font-weight: 600;
    font-size: 56px; line-height: 0.95; letter-spacing: -0.025em;
    margin: 0; text-shadow: 0 2px 16px rgba(0,0,0,0.25);
    color: var(--fg-on-dark);
  }
  h1 em { font-family: var(--font-serif); font-style: italic; color: var(--color-tan-light); }
  .sub-wrap { margin-top: 18px; display: inline-block; }
  .sub {
    display: inline; box-decoration-break: clone; -webkit-box-decoration-break: clone;
    background: var(--color-cream); color: var(--color-brown-deep);
    padding: 7px 14px; font-family: var(--font-serif); font-weight: 600; font-size: 18px; line-height: 1.85;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .page { position: absolute; bottom: 12px; right: 22px; z-index: 2; font-family: var(--font-serif); font-weight: 600; font-size: 12px; color: var(--fg-on-dark); }
</style></head><body>
  <div class="photo"></div>
  <span class="label">Journal · Community</span>
  <span class="issue">Issue No. 04 · Spring</span>
  <div class="wrap">
    <h1>Why community<br><em>matters</em></h1>
    <div class="sub-wrap"><span class="sub">When you're starting over in a new city.</span></div>
  </div>
  <span class="page">04</span>
</body></html>
