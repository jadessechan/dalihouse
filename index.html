<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dali House — Coliving for Women in Dallas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --charcoal: #1a1612;
      --charcoal-mid: #241d16;
      --cream: #faf4e8;
      --cream-light: #f3ead6;
      --tan: #c9a96e;
      --tan-light: #e8d5b0;
      --brown: #7c5c3e;
      --brown-deep: #3d2314;
      --crimson: #7a1c1c;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--brown-deep);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .nav.scrolled {
      background: rgba(22, 17, 13, 0.96);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    }
    .nav-inner {
      max-width: 1120px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
    }
    .nav-logo {
      font-family: var(--font-serif); font-size: 20px; font-weight: 600;
      text-decoration: none; letter-spacing: -0.2px;
      transition: color 0.3s;
    }
    .nav--dark .nav-logo { color: rgba(250,244,232,0.9); }
    .nav.scrolled .nav-logo { color: var(--brown-deep); }
    .nav-links { display: flex; align-items: center; gap: 36px; }
    .nav-links a {
      font-size: 13px; font-weight: 400; letter-spacing: 0.04em;
      text-decoration: none; transition: color 0.2s;
    }
    .nav--dark .nav-links a { color: rgba(250,244,232,0.65); }
    .nav--dark .nav-links a:hover { color: rgba(250,244,232,1); }
    .nav.scrolled .nav-links a { color: rgba(250,244,232,0.6); }
    .nav.scrolled .nav-links a:hover { color: rgba(250,244,232,1); }
    .nav-cta {
      padding: 9px 22px; border-radius: 100px;
      font-size: 12px !important; font-weight: 500 !important;
      letter-spacing: 0.1em !important; text-transform: uppercase;
      transition: background 0.2s, color 0.2s !important;
      border: 1px solid transparent;
    }
    .nav--dark .nav-cta {
      border-color: rgba(250,244,232,0.4);
      color: rgba(250,244,232,0.9) !important;
      background: transparent;
    }
    .nav--dark .nav-cta:hover {
      background: rgba(250,244,232,0.12) !important;
      color: #fff !important;
    }
    .nav.scrolled .nav-cta {
      background: transparent !important;
      color: rgba(250,244,232,0.85) !important;
      border-color: rgba(250,244,232,0.35) !important;
    }
    .nav.scrolled .nav-cta:hover { background: rgba(250,244,232,0.1) !important; color: #fff !important; }
    .nav-hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 4px;
    }
    .nav-hamburger span {
      display: block; width: 22px; height: 1.5px;
      transition: all 0.25s;
    }
    .nav--dark .nav-hamburger span { background: rgba(250,244,232,0.8); }
    .nav.scrolled .nav-hamburger span { background: rgba(250,244,232,0.8); }
    .nav-mobile {
      display: none; flex-direction: column;
      padding: 0 28px 24px;
      border-top: 1px solid rgba(250,244,232,0.08);
      background: rgba(22,17,13,0.97);
    }
    .nav-mobile.open { display: flex; }
    .nav-mobile a {
      font-size: 15px; color: rgba(250,244,232,0.65); text-decoration: none;
      padding: 13px 0; border-bottom: 1px solid rgba(250,244,232,0.07);
    }
    .nav-mobile .mobile-cta {
      margin-top: 14px; display: inline-block; align-self: flex-start;
      background: var(--brown-deep); color: var(--cream);
      padding: 11px 26px; border-radius: 100px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
    }

    /* ─── HERO ─── */
    .hero {
      min-height: 100vh;
      background: var(--charcoal);
      background-image: url('public/dali-house-hero.jpg');
      background-size: cover;
      background-position: center 85%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      position: relative; overflow: hidden;
    }
    /* dark + grain overlay */
    .hero::before {
      content: '';
      position: absolute; inset: 0; z-index: 0;
      background: rgba(10, 7, 5, 0.58);
    }
    .hero::after {
      content: '';
      position: absolute; inset: 0; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 180px;
      opacity: 0.06;
      pointer-events: none;
    }
    .hero-welcome, .hero-logo, .hero-tagline, .hero-cta, .hero-scroll { position: relative; z-index: 2; }
    .hero-welcome {
      font-size: 11px; font-weight: 400; letter-spacing: 0.4em; text-transform: uppercase;
      color: rgba(250,244,232,0.35); margin-bottom: 24px;
    }
    .hero-logo {
      width: min(88vw, 520px); height: auto; display: block; margin: 0 auto;
      position: relative; z-index: 1;
    }
    .hero-tagline {
      margin-top: 22px;
      font-size: 12px; font-weight: 400; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--tan); position: relative; z-index: 1;
    }
    .hero-cta {
      display: inline-block; margin-top: 40px; position: relative; z-index: 1;
      background: var(--cream-light); color: var(--brown-deep);
      padding: 15px 44px; border-radius: 100px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 4px 28px rgba(0,0,0,0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(0,0,0,0.3); }
    .hero-scroll {
      position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%);
      color: rgba(250,244,232,0.28); animation: bounce 2.4s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(7px); }
    }

    /* ─── ABOUT ─── */
    .about {
      background: var(--cream);
      padding: 112px 32px;
    }
    .about-inner {
      max-width: 1080px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: center;
    }
    .about-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--tan); margin-bottom: 20px;
    }
    .about-heading {
      font-family: var(--font-serif); font-size: clamp(34px, 4.5vw, 52px);
      font-weight: 500; line-height: 1.18; color: var(--brown-deep);
    }
    .about-heading em { font-style: italic; color: var(--tan); }
    .about-body {
      padding-top: 8px;
    }
    .about-body p {
      font-size: 16px; line-height: 1.8; font-weight: 300;
      color: var(--brown); margin-bottom: 20px;
    }
    .about-body p:last-child { margin-bottom: 0; }
    .about-quote {
      margin-top: 36px; padding-left: 22px;
      border-left: 2px solid var(--tan);
      font-family: var(--font-serif); font-size: 21px; font-style: italic;
      color: var(--brown-deep); line-height: 1.6;
    }
    .about-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .about-chip {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid rgba(124,92,62,0.2);
      padding: 9px 16px; border-radius: 100px;
      font-size: 13px; color: var(--brown); background: rgba(201,169,110,0.06);
    }
    .about-chip svg { flex-shrink: 0; color: var(--tan); }
    @media (max-width: 780px) {
      .about-inner { grid-template-columns: 1fr; gap: 40px; }
      .about { padding: 72px 24px; }
    }

    /* ─── FEATURES ─── */
    .features { background: var(--cream-light); padding: 96px 32px; }
    .section-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--tan); text-align: center; margin-bottom: 14px;
    }
    h2.section-heading {
      font-family: var(--font-serif); font-size: clamp(30px, 4vw, 44px);
      font-weight: 500; line-height: 1.2; text-align: center;
      color: var(--brown-deep);
    }
    .features-grid {
      margin-top: 56px; max-width: 1080px; margin-left: auto; margin-right: auto;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    }
    .feature-card {
      background: #fff; border-radius: 16px; padding: 40px 32px;
      text-align: center;
      box-shadow: 0 2px 20px rgba(61,35,20,0.055);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .feature-card:hover { transform: translateY(-4px); box-shadow: 0 10px 36px rgba(61,35,20,0.1); }
    .feature-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--crimson);
      margin: 0 auto 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .feature-card h3 {
      font-family: var(--font-serif); font-size: 18px; font-weight: 600;
      color: var(--brown-deep); margin-bottom: 10px;
    }
    .feature-card p { font-size: 14px; line-height: 1.75; color: var(--brown); font-weight: 300; }
    @media (max-width: 640px) { .features-grid { grid-template-columns: 1fr; } }

    /* ─── THE SPACE (combined) ─── */
    .the-space { background: var(--charcoal-mid); padding: 96px 32px; }
    .the-space h2.section-heading { color: var(--cream); }
    .the-space .section-label { color: var(--tan); }

    /* price + highlights */
    .price-block { text-align: center; margin-top: 28px; }
    .price-num {
      font-family: var(--font-serif); font-size: clamp(52px, 8vw, 72px); font-weight: 700;
      color: var(--tan); line-height: 1;
    }
    .price-unit { font-size: 15px; color: rgba(250,244,232,0.45); margin-left: 6px; }
    .highlights {
      margin: 28px auto 0; max-width: 720px;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    }
    .highlight-tag {
      display: flex; align-items: center; gap: 7px;
      border: 1px solid rgba(249,240,228,0.18);
      padding: 8px 16px; border-radius: 100px;
      font-size: 13px; color: rgba(250,244,232,0.75);
    }
    .highlight-tag svg { color: var(--tan); flex-shrink: 0; }
    .space-location {
      margin-top: 18px; text-align: center;
      font-size: 13px; color: rgba(250,244,232,0.38); font-weight: 300;
    }

    /* amenities strip */
    .amenities-strip {
      margin: 52px auto 0; max-width: 820px;
      padding: 32px 36px;
      border: 1px solid rgba(250,244,232,0.1);
      border-radius: 18px;
      background: rgba(250,244,232,0.04);
    }
    .amenities-strip-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--tan); margin-bottom: 18px; text-align: center;
    }
    .amenities-list {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    }
    .amenity-tag {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(250,244,232,0.18);
      padding: 8px 16px; border-radius: 100px;
      font-size: 13px; color: rgba(250,244,232,0.8);
    }
    .bath-note {
      margin-top: 16px; text-align: center;
      font-size: 12px; font-style: italic; color: rgba(250,244,232,0.38);
      line-height: 1.6;
    }

    /* rooms grid with photos */
    .rooms-grid {
      margin: 52px auto 0; max-width: 1080px;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
    }
    .room-card {
      border-radius: 16px; overflow: hidden;
      background: rgba(250,244,232,0.04);
      border: 1px solid rgba(250,244,232,0.09);
      transition: border-color 0.2s;
    }
    .room-card:hover { border-color: rgba(250,244,232,0.18); }
    .room-photo {
      width: 100%; aspect-ratio: 4/3;
      overflow: hidden;
    }
    .room-photo-inner {
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        -45deg,
        transparent, transparent 10px,
        rgba(250,244,232,0.025) 10px, rgba(250,244,232,0.025) 20px
      );
      display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center;
    }
    .room-photo-label {
      font-family: monospace; font-size: 11px;
      color: rgba(250,244,232,0.3); line-height: 1.5;
    }
    .room-body { padding: 20px 22px 24px; }
    .room-card h4 {
      font-family: var(--font-serif); font-size: 16px; font-weight: 500;
      color: var(--tan); margin-bottom: 6px;
    }
    .room-card p { font-size: 13px; line-height: 1.65; color: rgba(250,244,232,0.52); font-weight: 300; }
    .space-note {
      margin-top: 36px; text-align: center;
      font-size: 12px; font-style: italic; color: rgba(250,244,232,0.25);
    }
    @media (max-width: 768px) { .rooms-grid { grid-template-columns: 1fr; } }
    @media (max-width: 480px) { .rooms-grid { grid-template-columns: 1fr; } }

    /* ─── HOW IT WORKS ─── */
    .how-it-works { background: var(--brown-deep); padding: 96px 32px; }
    .how-it-works h2.section-heading { color: var(--cream); }
    .how-it-works .section-label { color: rgba(201,169,110,0.7); }
    .steps-grid {
      margin: 56px auto 0; max-width: 900px;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 40px 32px;
    }
    .step { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .step-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(201,169,110,0.12);
      border: 1px solid rgba(201,169,110,0.2);
      display: flex; align-items: center; justify-content: center;
      color: var(--tan); margin-bottom: 20px; flex-shrink: 0;
    }
    .step-num {
      font-family: var(--font-serif); font-size: 11px; font-weight: 600;
      letter-spacing: 0.18em; color: rgba(201,169,110,0.5);
      text-transform: uppercase; margin-bottom: 2px;
    }
    .step h3 {
      font-family: var(--font-serif); font-size: 18px; font-weight: 600;
      color: var(--tan); margin-top: 12px; margin-bottom: 10px;
    }
    .step p { font-size: 14px; line-height: 1.72; color: rgba(250,244,232,0.62); font-weight: 300; }
    .how-cta { margin-top: 52px; text-align: center; }
    .btn-light {
      display: inline-block;
      background: var(--cream-light); color: var(--brown-deep);
      padding: 14px 38px; border-radius: 100px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
      text-decoration: none; transition: transform 0.2s, background 0.2s;
    }
    .btn-light:hover { transform: translateY(-2px); background: var(--cream); }
    @media (max-width: 640px) { .steps-grid { grid-template-columns: 1fr; gap: 28px; } }

    /* ─── NAV TITLE IMG ─── */
    .nav-logo-img { display: flex; align-items: center; text-decoration: none; }
    .nav-title-img { height: 36px; width: auto; display: block; }
    .nav--dark .nav-title-img { filter: brightness(0) invert(1) opacity(0.85); }
    .nav.scrolled .nav-title-img { filter: brightness(0) invert(1) opacity(0.85); }

    /* ─── MEET HOST ─── */
    .meet-host { background: var(--cream); padding: 96px 32px 56px; }
    .meet-host h2.section-heading { color: var(--brown-deep); margin-bottom: 0; }
    .host-grid {
      margin-top: 56px; max-width: 1080px; margin-left: auto; margin-right: auto;
      display: grid; grid-template-columns: 300px 1fr;
      gap: 64px; align-items: start;
    }
    .host-img-wrap { position: relative; padding-left: 24px; }
    .host-photo {
      width: 100%; max-height: 420px; aspect-ratio: 3/4;
      object-fit: cover; object-position: center 60%;
      border-radius: 18px; display: block;
    }
    .host-cats-img { display: block; margin: 16px auto 0; }
    .host-name {
      font-family: var(--font-serif); font-size: 24px; font-weight: 500;
      color: var(--tan); margin-bottom: 22px;
    }
    .host-bio p {
      font-size: 15px; line-height: 1.82; color: var(--brown); font-weight: 300;
      margin-bottom: 18px;
    }
    .host-bio p:last-of-type { margin-bottom: 0; }
    .host-quote {
      margin-top: 28px; padding-left: 20px;
      border-left: 2px solid var(--tan);
      font-family: var(--font-serif); font-size: 21px; font-style: italic;
      color: var(--brown-deep); line-height: 1.6;
    }
    .cats-row {
      margin-top: 28px;
      display: flex; align-items: center; gap: 16px;
    }
    .cats-img-large { width: 50%; max-width: 180px; height: auto; object-fit: contain; flex-shrink: 0; display: block; margin: 16px auto 0; }
    .host-fact-chips { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .host-fact-chip {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: rgba(124,92,62,0.65);
    }
    .host-fact-chip svg { color: var(--tan); flex-shrink: 0; }
    .host-cats-caption {
      text-align: center; margin-top: 8px;
      font-size: 12px; color: rgba(124,92,62,0.55); font-style: italic;
    }
    @media (max-width: 820px) {
      .host-grid { grid-template-columns: 1fr; gap: 36px; }
      .host-photo { aspect-ratio: 3/4; }
    }

    /* ─── QUOTE ─── */
    .quote-section { background: var(--cream-light); padding: 64px 32px; }
    .quote-inner { max-width: 640px; margin: 0 auto; }
    .quote-img { width: 100%; height: auto; display: block; }

    /* ─── FAQ ─── */
    .faq { background: var(--cream); padding: 56px 32px 96px; }
    .faq h2.section-heading { color: var(--brown-deep); }
    .faq-inner { max-width: 1080px; margin: 0 auto; }
    .faq-list { margin: 48px 0 0; max-width: 700px; }
    .faq-item { border-bottom: 1px solid rgba(124,92,62,0.11); }
    .faq-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0; text-align: left;
      background: none; border: none; cursor: pointer; gap: 16px;
    }
    .faq-btn span {
      font-family: var(--font-serif); font-size: 16px; font-weight: 500;
      color: var(--brown-deep); line-height: 1.45;
    }
    .faq-chevron {
      flex-shrink: 0; color: var(--brown);
      transition: transform 0.3s;
    }
    .faq-chevron.open { transform: rotate(180deg); }
    .faq-answer {
      overflow: hidden; transition: max-height 0.38s ease, padding 0.3s;
      max-height: 0;
    }
    .faq-answer.open { max-height: 500px; padding-bottom: 22px; }
    .faq-answer p { font-size: 14px; line-height: 1.78; color: var(--brown); font-weight: 300; }

    /* ─── FOOTER CTA ─── */
    .footer-cta {
      background: var(--charcoal);
      background-image: url('public/dali-house-bg.png');
      background-size: cover;
      background-position: center;
      padding: 104px 32px;
      position: relative; overflow: hidden;
    }
    .footer-cta::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(14, 10, 7, 0.72);
      pointer-events: none;
    }
    .footer-cta-inner {
      position: relative; z-index: 1;
      max-width: 1080px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr;
      align-items: center; gap: 60px;
    }
    .footer-cta h2 {
      font-family: var(--font-serif); font-size: clamp(34px, 5vw, 56px);

    if (e.data && e.data.type === '__activate_edit_mode')
      document.getElementById('tweaks-panel').classList.add('visible');
    if (e.data && e.data.type === '__deactivate_edit_mode')
      document.getElementById('tweaks-panel').classList.remove('visible');
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');

  function applyTweaks(t) {
    document.documentElement.style.setProperty('--tan', t.accentColor || '#c9a96e');
    const hero = document.querySelector('.hero');
    if (hero) hero.style.background = t.heroStyle === 'warm' ? '#3a1f0f' : '';
  }

  document.getElementById('tweak-accent').addEventListener('input', function() {
    const vals = getVals(); applyTweaks(vals);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: vals.accentColor } }, '*');
  });
  document.getElementById('tweak-hero').addEventListener('change', function() {
    const vals = getVals(); applyTweaks(vals);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { heroStyle: vals.heroStyle } }, '*');
  });
  document.getElementById('tweak-about').addEventListener('change', function() {
    const vals = getVals();
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { aboutLayout: vals.aboutLayout } }, '*');
  });
  function getVals() {
    return {
      accentColor: document.getElementById('tweak-accent').value,
      heroStyle: document.getElementById('tweak-hero').value,
      aboutLayout: document.getElementById('tweak-about').value,
    };
  }
})();
</script>
</body>
</html>
